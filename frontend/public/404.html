<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — RoutineOS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fafafa;
      color: #09090b;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 28rem;
    }

    .orb {
      width: 96px;
      height: 96px;
      margin: 0 auto 2rem;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #38bdf8, #0ea5e9 50%, #0284c7);
      box-shadow: 0 0 40px rgba(14, 165, 233, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: float 4s ease-in-out infinite;
    }

    .orb svg { width: 40px; height: 40px; color: white; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #0ea5e9, #d946ef);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 1rem;
      color: #09090b;
    }

    p {
      margin-top: 0.75rem;
      color: #71717a;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 2rem;
      padding: 0.75rem 1.75rem;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    .btn:hover {
      background: #0369a1;
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(2, 132, 199, 0.4);
    }

    .btn:active { transform: translateY(0); }

    .btn svg { width: 16px; height: 16px; }

    .brand {
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #a1a1aa;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      .code { font-size: 4.5rem; }
      h1 { font-size: 1.25rem; }
    }

    @media (prefers-color-scheme: dark) {
      body { background: #09090b; color: #fafafa; }
      h1 { color: #fafafa; }
      p { color: #a1a1aa; }
      .brand { color: #52525b; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="orb">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to planning your week.</p>
    <a href="/" class="btn">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="9,22 9,12 15,12 15,22" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Back to Home
    </a>
    <div class="brand">RoutineOS — Personal Routine Planning Agent</div>
  </div>
</body>
</html>
